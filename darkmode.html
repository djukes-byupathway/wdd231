<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Light and Dark Mode Toggle</title>

    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");

            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            const startingTheme =
                savedTheme || (prefersDark ? "dark" : "light");

            document.documentElement.setAttribute(
                "data-theme",
                startingTheme
            );
        })();
    </script>

    <style>
        :root {
            color-scheme: light;

            --background: #ffffff;
            --surface: #f4f6f8;
            --text: #1d2433;
            --muted-text: #5f6878;
            --border: #d8dde5;
            --primary: #3457d5;
            --primary-hover: #2947b8;
            --focus: #006cff;

            --toggle-background: #747b88;
            --toggle-thumb: #ffffff;

            --shadow:
                0 12px 30px rgba(20, 30, 50, 0.12);
        }

        html[data-theme="dark"] {
            color-scheme: dark;

            --background: #11141a;
            --surface: #1c212b;
            --text: #f4f6fa;
            --muted-text: #b5bdca;
            --border: #3a4250;
            --primary: #8fa7ff;
            --primary-hover: #afbeff;
            --focus: #8cc4ff;

            --toggle-background: #526fda;
            --toggle-thumb: #ffffff;

            --shadow:
                0 12px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: var(--background);
            color: var(--text);
            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            background-color: var(--surface);
            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;
        }

        .site-name {
            margin: 0;
            font-size: 1.25rem;
        }

        .theme-control {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .theme-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: var(--text);
        }

        .theme-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /*
      Hide the checkbox visually while keeping it
      available to assistive technology.
    */
        .theme-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 58px;
            height: 32px;
            cursor: pointer;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-radius: 999px;
            background-color: var(--toggle-background);
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .toggle-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--toggle-thumb);
            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .theme-checkbox:checked+.toggle-track .toggle-thumb {
            transform: translateX(26px);
        }

        .theme-checkbox:focus-visible+.toggle-track {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .toggle-switch:hover .toggle-track {
            filter: brightness(1.08);
        }

        .theme-text {
            min-width: 78px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        main {
            width: min(900px, calc(100% - 32px));
            margin: 64px auto;
        }

        .hero {
            padding: 48px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background-color: var(--surface);
            box-shadow: var(--shadow);
            transition:
                background-color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
        }

        p {
            max-width: 650px;
            margin-bottom: 24px;
            color: var(--muted-text);
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .primary-button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            background-color: var(--primary);
            color: var(--background);
            font-weight: 700;
            text-decoration: none;
            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        .primary-button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .primary-button:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .site-header {
                padding: 16px;
            }

            .theme-icon {
                display: none;
            }

            main {
                margin-top: 32px;
            }

            .hero {
                padding: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h2 class="site-name">My Website</h2>

        <div class="theme-control">
            <span class="theme-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M4.93 4.93l1.42 1.42"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="M4.93 19.07l1.42-1.42"></path>
                    <path d="M17.66 6.34l1.41-1.41"></path>
                </svg>
            </span>

            <label class="toggle-switch">
                <input id="theme-toggle" class="theme-checkbox" type="checkbox" role="switch"
                    aria-label="Enable dark mode">

                <span class="toggle-track" aria-hidden="true">
                    <span class="toggle-thumb"></span>
                </span>
            </label>

            <span class="theme-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3
               7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>

            <span id="theme-text" class="theme-text" aria-live="polite">
                Light mode
            </span>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Light and Dark Mode</h1>

            <p>
                Use the toggle switch in the header to change the
                website between light and dark mode. Your selection
                will be remembered when you return.
            </p>

            <a class="primary-button" href="#">
                Example Button
            </a>
        </section>
    </main>

    <script>
        const root = document.documentElement;
        const toggle = document.getElementById("theme-toggle");
        const themeText = document.getElementById("theme-text");

        function updateThemeControls(theme) {
            const isDark = theme === "dark";

            toggle.checked = isDark;

            toggle.setAttribute(
                "aria-label",
                isDark
                    ? "Disable dark mode"
                    : "Enable dark mode"
            );

            themeText.textContent = isDark
                ? "Dark mode"
                : "Light mode";
        }

        function setTheme(theme) {
            root.setAttribute("data-theme", theme);
            localStorage.setItem("theme", theme);
            updateThemeControls(theme);
        }

        toggle.addEventListener("change", function () {
            setTheme(toggle.checked ? "dark" : "light");
        });

        updateThemeControls(
            root.getAttribute("data-theme")
        );
    </script>
</body>

</html>
